<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evo AI | 로그인</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Apple SD Gothic Neo",sans-serif;background:#f1f5fb;color:#1d3556}header{background:#162c4b;color:white;padding:18px 5vw;font-weight:800}main{max-width:660px;margin:40px auto;padding:0 18px}.card{background:white;border:1px solid #dbe4f0;border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:0 8px 28px #1b31550b}h1{font-size:24px;margin:0 0 14px}h2{font-size:19px}label{display:block;font-size:13px;font-weight:700;margin:12px 0}input,select{display:block;width:100%;margin-top:6px;border:1px solid #b9c8db;border-radius:8px;padding:10px;font:inherit}button{border:0;border-radius:8px;background:#2759c9;color:white;padding:10px 16px;cursor:pointer;margin:6px 5px 6px 0}button.secondary{background:#e6ebf5;color:#203b5d}.hint{color:#637a94;font-size:13px;line-height:1.6}.message{white-space:pre-wrap;color:#a43e45;font-size:13px}.hidden{display:none}.staff{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid #e4ebf4;padding:10px 0;flex-wrap:wrap}.staff input[type=color]{width:46px;height:36px;padding:2px;margin:0}.staff button{font-size:12px}.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:5px}
</style></head><body><header>✦ Evo AI · Academy Planner</header><main>
<section id="loginPanel" class="card"><h1>선생님 로그인</h1><p class="hint">본인 아이디와 비밀번호를 입력하세요. 다른 선생님의 시간표는 볼 수 없습니다.</p><form id="loginForm"><label>아이디<input id="username" autocomplete="username" required placeholder="Lucy"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">로그인</button></form><p id="loginMessage" class="message" role="alert"></p></section>
<section id="accountPanel" class="card hidden"><h1>내 계정</h1><p id="welcome"></p><p id="changeNotice" class="hint"></p><form id="changeForm"><label>새 비밀번호<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></label><label>새 비밀번호 확인<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></label><button type="submit">비밀번호 변경</button><button type="button" id="logout" class="secondary">로그아웃</button></form><p class="hint">비밀번호는 12자 이상을 권장해요. 계정 생성 및 초기화는 관리자만 할 수 있습니다.</p><p id="accountMessage" class="message" role="alert"></p><a id="scheduleLink" href="./" class="hidden">기존 시간표 열기</a></section>
<section id="adminPanel" class="card hidden"><h2>관리자 · 선생님 관리</h2><p class="hint">선생님 추가 시 임시 비밀번호가 한 번 표시됩니다. 안전하게 전달하고 첫 로그인 때 변경하도록 안내해 주세요.</p><form id="createForm"><label>새 선생님 아이디<input id="newName" pattern="[A-Za-z][A-Za-z0-9_-]{1,30}" required placeholder="NewTeacher"></label><button type="submit">선생님 추가</button></form><p id="adminMessage" class="message" role="alert"></p><div id="staffList"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const client=supabase.createClient("https://eovntwuvjzvnztyxzwer.supabase.co","sb_publishable_XMxCvN3wguCsjUY-6GrR2g_HidFJtoc");
let current=null;
function msg(id,text){$(id).textContent=text||""}
function show(id,visible){$(id).classList.toggle("hidden",!visible)}
async function load(){
 const {data:{user}}=await client.auth.getUser();
 if(!user){current=null;show("loginPanel",true);show("accountPanel",false);show("adminPanel",false);return;}
 const {data,error}=await client.from("staff_profiles").select("*").eq("user_id",user.id).single();
 if(error||!data){await client.auth.signOut();msg("loginMessage","등록되지 않은 계정입니다. 관리자에게 문의하세요.");return load();}
 current=data;show("loginPanel",false);show("accountPanel",true);show("adminPanel",data.role==="admin");
 $("welcome").textContent=data.display_name+" · "+(data.role==="admin"?"관리자":"선생님");
 $("changeNotice").textContent=data.must_change_password?"첫 로그인입니다. 다른 기능을 사용하기 전에 비밀번호를 변경하세요.":"필요할 때 비밀번호를 변경할 수 있어요.";
 show("scheduleLink",!data.must_change_password);
 if(data.role==="admin")await staff();
}
$("loginForm").onsubmit=async e=>{
 e.preventDefault();msg("loginMessage","로그인 확인 중...");
 const name=$("username").value.trim();
 if(!/^[A-Za-z][A-Za-z0-9_-]{1,30}$/.test(name)){msg("loginMessage","아이디를 확인해 주세요.");return;}
 const {error}=await client.auth.signInWithPassword({email:name.toLowerCase()+"@accounts.evo-ai.invalid",password:$("password").value});
 $("password").value="";
 if(error){msg("loginMessage","아이디 또는 비밀번호가 올바르지 않습니다.");return;}
 msg("loginMessage","");await load();
};
$("changeForm").onsubmit=async e=>{
 e.preventDefault();const p=$("newPassword").value;
 if(p.length<12||p!==$("confirmPassword").value){msg("accountMessage","12자 이상이며 서로 일치하는 비밀번호를 입력해 주세요.");return;}
 const {error}=await client.auth.updateUser({password:p});
 if(error){msg("accountMessage",error.message);return;}
 const {error:flagError}=await client.rpc("confirm_my_password_change");
 $("newPassword").value="";$("confirmPassword").value="";
 msg("accountMessage",flagError?"비밀번호는 변경됐지만 상태 업데이트에 실패했습니다. 관리자에게 문의하세요.":"비밀번호가 변경됐습니다.");
 await load();
};
$("logout").onclick=async()=>{await client.auth.signOut();await load()};
async function adminCall(payload){
 const {data:{session}}=await client.auth.getSession();
 if(!session)throw Error("다시 로그인해 주세요.");
 const response=await fetch("https://eovntwuvjzvnztyxzwer.supabase.co/functions/v1/academy-admin",{method:"POST",headers:{"Content-Type":"application/json","apikey":"sb_publishable_XMxCvN3wguCsjUY-6GrR2g_HidFJtoc","Authorization":"Bearer "+session.access_token},body:JSON.stringify(payload)});
 const result=await response.json();if(!response.ok)throw Error(result.error||"요청 실패");return result;
}
$("createForm").onsubmit=async e=>{
 e.preventDefault();msg("adminMessage","계정 생성 중...");
 try{const name=$("newName").value.trim(),r=await adminCall({action:"create",name});msg("adminMessage",name+" 임시 비밀번호: "+r.temporary_password+"\n이 화면을 닫으면 다시 볼 수 없습니다.");$("newName").value="";await staff()}catch(err){msg("adminMessage",err.message)}
};
async function staff(){
 const {data,error}=await client.from("staff_profiles").select("user_id,display_name,role,theme_color").order("display_name");
 if(error){msg("adminMessage",error.message);return;}
 const box=$("staffList");box.replaceChildren();
 for(const p of data){
 const row=document.createElement("div");row.className="staff";
 const label=document.createElement("strong");label.textContent=p.display_name+(p.role==="admin"?" (관리자)":"");
 const color=document.createElement("input");color.type="color";color.value=p.theme_color;color.title=p.display_name+" 테마 색상";
 color.onchange=async()=>{try{await adminCall({action:"color",user_id:p.user_id,color:color.value});msg("adminMessage",p.display_name+" 색상 저장 완료")}catch(e){msg("adminMessage",e.message)}};
 const reset=document.createElement("button");reset.type="button";reset.className="secondary";reset.textContent="비밀번호 초기화";
 reset.onclick=async()=>{if(!confirm(p.display_name+" 비밀번호를 초기화할까요?"))return;try{const r=await adminCall({action:"reset",user_id:p.user_id});msg("adminMessage",p.display_name+" 새 임시 비밀번호: "+r.temporary_password)}catch(e){msg("adminMessage",e.message)}};
 row.append(label,color,reset);box.appendChild(row);
 }
}
load();
})();
</script></body></html>
