
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evo AI - 진화하는 웹사이트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: white;
    }
    header {
      padding: 20px;
      border-bottom: 1px solid #334155;
      font-weight: bold;
      font-size: 22px;
    }
    main {
      max-width: 680px;
      margin: 70px auto;
      padding: 20px;
      text-align: center;
    }
    h1 { font-size: 42px; margin-bottom: 12px; }
    p { color: #94a3b8; line-height: 1.7; }
    .panel {
      margin-top: 36px;
      padding: 24px;
      background: #1e293b;
      border-radius: 18px;
      text-align: left;
    }
    textarea {
      width: 100%;
      min-height: 130px;
      padding: 14px;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #334155;
      color: white;
      font: inherit;
      resize: vertical;
    }
    button {
      margin-top: 16px;
      width: 100%;
      padding: 15px;
      background: #2563eb;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .version {
      color: #60a5fa;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>🧠 Evo AI</header>
  <main>
    <div class="version">VERSION 0.1</div>
    <h1>함께 진화하는 AI</h1>
    <p>
      당신의 아이디어가 이 웹사이트의 미래를 만듭니다.
      원하는 기능을 제안해 주세요.
    </p>
    <div class="panel">
      <h3>💡 개선 아이디어 제출</h3>
      <textarea id="idea"
        placeholder="예: AI 채팅 기능을 추가해줘"></textarea>
      <button onclick="submitIdea()">
        개선 의견 보내기 →
      </button>
      <p style="font-size:12px">
        GitHub에서 개선 요청을 등록합니다.
        제출하려면 GitHub 로그인이 필요합니다.
      </p>
    </div>
  </main>

  <script>
    function submitIdea() {
      const idea = document.getElementById("idea")
        .value.trim();

      if (!idea) {
        alert("개선 의견을 입력해 주세요.");
        return;
      }

      const path = location.pathname.split("/")
        .filter(Boolean)[0];

      const repo = path || "evo-ai";
      const owner = location.hostname.split(".")[0];

      const url = `https://github.com/${owner}/${repo}/issues/new?title=${encodeURIComponent("개선 제안")}&body=${encodeURIComponent(idea)}`;

      window.open(url, "_blank", "noopener");
    }
  </script>
</body>
</html>
